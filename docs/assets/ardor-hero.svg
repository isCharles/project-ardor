<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Project Ardor</title>
  <desc id="desc">A vibrant illustration of an AI career companion turning a conversation into a clear preparation journey.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="0.52" stop-color="#fffaf8"/>
      <stop offset="1" stop-color="#f5f7ff"/>
    </linearGradient>
    <radialGradient id="warm">
      <stop offset="0" stop-color="#ff9d63" stop-opacity=".76"/>
      <stop offset=".55" stop-color="#ff75b4" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ff75b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool">
      <stop offset="0" stop-color="#7877ff" stop-opacity=".56"/>
      <stop offset=".6" stop-color="#8cc9ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8cc9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff774d"/>
      <stop offset=".52" stop-color="#f263a5"/>
      <stop offset="1" stop-color="#7c73f5"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb16c"/>
      <stop offset=".55" stop-color="#ed77b9"/>
      <stop offset="1" stop-color="#8f8bfb"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#5b5278" flood-opacity=".15"/>
    </filter>
    <filter id="softBlur"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="rounded"><rect width="1280" height="620" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1280" height="620" fill="url(#canvas)"/>
    <ellipse cx="402" cy="590" rx="500" ry="360" fill="url(#warm)"/>
    <ellipse cx="1120" cy="476" rx="470" ry="420" fill="url(#cool)"/>
    <ellipse cx="954" cy="106" rx="230" ry="130" fill="#ffcda9" opacity=".3" filter="url(#softBlur)"/>
    <path d="M0 520C216 470 358 490 557 562C760 638 960 608 1280 522" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>

    <g font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
      <rect x="72" y="62" width="44" height="44" rx="13" fill="#17161d"/>
      <path d="M94 74c-2 8 6 10 5 16-1 4-3 6-7 6-5 0-8-4-7-9 1-4 3-6 5-8 0 5 3 7 4 8 1-5-2-8 0-13z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="132" y="81" fill="#191820" font-size="15" font-weight="800" letter-spacing="2.6">PROJECT ARDOR</text>
      <text x="132" y="102" fill="#817985" font-size="10" font-weight="700" letter-spacing="3.4">AI CAREER AGENT</text>

      <text x="72" y="234" fill="#1d1a21" font-size="75" font-weight="760" letter-spacing="-4">Career,</text>
      <text x="72" y="316" fill="#1d1a21" font-size="75" font-weight="760" letter-spacing="-4">in <tspan fill="url(#accent)">motion.</tspan></text>
      <text x="76" y="377" fill="#4f4a55" font-size="21" font-weight="500">Every interview is a beginning.</text>
      <text x="76" y="410" fill="#4f4a55" font-size="21" font-weight="500">Make the next one yours.</text>

      <rect x="75" y="462" width="235" height="49" rx="24.5" fill="#1f1b23"/>
      <circle cx="101" cy="486" r="8" fill="url(#accent)"/>
      <text x="121" y="493" fill="#ffffff" font-size="15" font-weight="650">Keep the fire going</text>
      <path d="M330 487h81" stroke="#716b75" stroke-width="1.5"/>
      <path d="m404 480 8 7-8 7" fill="none" stroke="#716b75" stroke-width="1.5"/>

      <g filter="url(#shadow)">
        <rect x="660" y="76" width="544" height="462" rx="29" fill="#ffffff" fill-opacity=".94" stroke="#ffffff" stroke-width="2"/>
      </g>
      <rect x="682" y="97" width="500" height="65" rx="20" fill="#faf8f7"/>
      <circle cx="711" cy="129" r="15" fill="#211d24"/>
      <path d="M710 122c-1 4 4 5 3 9-.5 2-2 3-4 3-3 0-5-2-4-5 .5-2 2-4 3-5 .1 2 1 3 2 4 .4-3-1-4 0-6z" fill="none" stroke="#fff" stroke-width="1.4"/>
      <text x="739" y="128" fill="#292630" font-size="15" font-weight="750">Ardor</text>
      <text x="739" y="145" fill="#a5a0a8" font-size="11">Your career companion</text>
      <circle cx="1110" cy="129" r="4.5" fill="#58bd95"/>
      <text x="1124" y="134" fill="#77717e" font-size="11" font-weight="600">HERE</text>

      <rect x="785" y="187" width="373" height="48" rx="19" fill="#f3eff9"/>
      <text x="808" y="217" fill="#51445d" font-size="16" font-weight="500">I have an interview next week.</text>
      <rect x="687" y="253" width="381" height="79" rx="21" fill="#fff7f2"/>
      <rect x="687" y="253" width="5" height="79" rx="2.5" fill="url(#accent)"/>
      <text x="713" y="286" fill="#25202a" font-size="18" font-weight="700">Let's make every day count.</text>
      <text x="713" y="310" fill="#8d818b" font-size="13">One clear step at a time.</text>

      <path d="M728 379h413" stroke="#e9e4ec" stroke-width="6" stroke-linecap="round"/>
      <path d="M728 379h265" stroke="url(#track)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="728" cy="379" r="13" fill="#ffb16c" stroke="#fff" stroke-width="5"/>
      <circle cx="866" cy="379" r="13" fill="#ed88ad" stroke="#fff" stroke-width="5"/>
      <circle cx="1003" cy="379" r="13" fill="#a684ee" stroke="#fff" stroke-width="5"/>
      <circle cx="1141" cy="379" r="13" fill="#e7e2f0" stroke="#fff" stroke-width="5"/>
      <text x="705" y="416" fill="#68616b" font-size="12" font-weight="650">Understand</text>
      <text x="844" y="416" fill="#68616b" font-size="12" font-weight="650">Practice</text>
      <text x="986" y="416" fill="#68616b" font-size="12" font-weight="650">Improve</text>
      <text x="1121" y="416" fill="#a29aa6" font-size="12" font-weight="650">Repeat</text>

      <rect x="686" y="447" width="474" height="65" rx="18" fill="#f8f8fc"/>
      <circle cx="715" cy="479" r="13" fill="#e8e2ff"/>
      <path d="m710 480 4 4 7-9" fill="none" stroke="#8061dd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="740" y="474" fill="#403b48" font-size="13" font-weight="720">YOUR NEXT STEP</text>
      <text x="740" y="493" fill="#8a8291" font-size="12">Already taking shape.</text>
      <circle cx="1127" cy="479" r="15" fill="#27222d"/>
      <path d="M1122 484l10-10m-8 0h8v8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
