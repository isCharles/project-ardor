spring:
  application:
    name: ardor-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/ardor}
    username: ${DATABASE_USER:ardor}
    password: ${DATABASE_PASSWORD:ardor_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 5s
      timeout: 5s
  session:
    timeout: 30d
    data:
      redis:
        namespace: ardor:session
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  task:
    scheduling:
      pool:
        size: 4

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  admin:
    emails: ${ARDOR_ADMIN_EMAILS:}
  http:
    proxy-host: ${ARDOR_HTTP_PROXY_HOST:}
    proxy-port: ${ARDOR_HTTP_PROXY_PORT:0}
    connect-timeout: ${ARDOR_HTTP_CONNECT_TIMEOUT:10s}
    read-timeout: ${ARDOR_HTTP_READ_TIMEOUT:120s}
  security:
    api-key-encryption-key: ${ARDOR_ENCRYPTION_KEY}
    allow-private-api-base-urls: ${ARDOR_ALLOW_PRIVATE_API_BASE_URLS:false}
  storage:
    resume-directory: ${ARDOR_RESUME_STORAGE:./data/resumes}
