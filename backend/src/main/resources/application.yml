spring:
  application:
    name: ardor-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/ardor}
    username: ${DATABASE_USER:ardor}
    password: ${DATABASE_PASSWORD:ardor_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 5s
      timeout: 5s
  session:
    timeout: 30d
    data:
      redis:
        namespace: ardor:session
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  task:
    scheduling:
      pool:
        size: 4

server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  # Technical tracing is opt-in. The product trace in PostgreSQL and all run state do not
  # depend on this switch; disabling it only stops OTel span creation and export.
  opentelemetry:
    enabled: ${ARDOR_OTEL_ENABLED:false}
    map-environment-variables: false
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: ${ARDOR_OTEL_DEPLOYMENT_ENV:local}
    tracing:
      export:
        max-batch-size: ${ARDOR_OTEL_MAX_BATCH_SIZE:512}
        max-queue-size: ${ARDOR_OTEL_MAX_QUEUE_SIZE:2048}
        schedule-delay: ${ARDOR_OTEL_SCHEDULE_DELAY:5s}
        timeout: ${ARDOR_OTEL_BATCH_TIMEOUT:30s}
        include-unsampled: false
    logging:
      # Logs keep their existing console/SLF4J pipeline. Enabling a second OTel log
      # exporter would duplicate records and ship message bodies to the collector.
      export:
        otlp:
          enabled: false
  tracing:
    sampling:
      probability: ${ARDOR_OTEL_SAMPLE_RATE:1.0}
    export:
      # The application supplies its own counted OTLP exporter (OtelExportConfiguration);
      # leaving Boot's exporter enabled would export every span twice.
      otlp:
        enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %level [%thread] %logger{36} — %msg — traceId=%X{traceId:-} spanId=%X{spanId:-} runId=%X{runId:-} userId=%X{userId:-}%n"
  level:
    com.projectardor: INFO

app:
  agent:
    queue:
      enabled: ${ARDOR_AGENT_QUEUE_ENABLED:true}
      capacity: ${ARDOR_AGENT_QUEUE_CAPACITY:2}
  ai-jobs:
    worker-capacity: ${ARDOR_AI_JOB_WORKER_CAPACITY:2}
  admin:
    emails: ${ARDOR_ADMIN_EMAILS:}
  auth:
    # Empty keeps open registration for local use. A comma-separated list limits
    # account creation to those addresses, without changing login for existing users.
    registration-allowlist: ${ARDOR_REGISTRATION_ALLOWLIST:}
  realtime:
    # Browser origins allowed to open the voice WebSocket. Add the public HTTPS origin
    # when the app is served through a tunnel; same-origin HTTP local development keeps
    # the two loopback entries.
    allowed-origins: ${ARDOR_REALTIME_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  http:
    proxy-host: ${ARDOR_HTTP_PROXY_HOST:}
    proxy-port: ${ARDOR_HTTP_PROXY_PORT:0}
    connect-timeout: ${ARDOR_HTTP_CONNECT_TIMEOUT:10s}
    read-timeout: ${ARDOR_HTTP_READ_TIMEOUT:120s}
  model:
    prompt-cache:
      enabled: ${ARDOR_PROMPT_CACHE_ENABLED:false}
      tools: ${ARDOR_PROMPT_CACHE_TOOLS:true}
    max-concurrent-calls: ${ARDOR_MODEL_MAX_CONCURRENT_CALLS:8}
    qpm: ${ARDOR_MODEL_QPM:0}
    tpm: ${ARDOR_MODEL_TPM:0}
    user-qpm: ${ARDOR_MODEL_USER_QPM:0}
  observability:
    queue-sample-interval: ${ARDOR_QUEUE_SAMPLE_INTERVAL:15s}
    otel:
      enabled: ${ARDOR_OTEL_ENABLED:false}
      endpoint: ${ARDOR_OTEL_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      timeout: ${ARDOR_OTEL_TIMEOUT:10s}
      connect-timeout: ${ARDOR_OTEL_CONNECT_TIMEOUT:5s}
  speech:
    openai-voice: ${ARDOR_OPENAI_TTS_VOICE:alloy}
    dashscope-voice: ${ARDOR_DASHSCOPE_TTS_VOICE:Cherry}
    realtime-asr-model: ${ARDOR_REALTIME_ASR_MODEL:qwen3-asr-flash-realtime}
    realtime-tts-model: ${ARDOR_REALTIME_TTS_MODEL:qwen3-tts-flash-realtime}
    vad-silence-duration: ${ARDOR_VAD_SILENCE_DURATION:800}
  security:
    api-key-encryption-key: ${ARDOR_ENCRYPTION_KEY}
    allow-private-api-base-urls: ${ARDOR_ALLOW_PRIVATE_API_BASE_URLS:false}
  storage:
    resume-directory: ${ARDOR_RESUME_STORAGE:./data/resumes}
