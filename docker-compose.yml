name: project-ardor

services:
  postgres:
    # pgvector build of PostgreSQL 17: same major version and on-disk format as the
    # previous postgres:17-alpine image, plus the `vector` extension that V16 enables
    # for knowledge-base semantic search.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ardor}
      POSTGRES_USER: ${POSTGRES_USER:-ardor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ardor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ardor-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      network: host
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ardor}
      DATABASE_USER: ${POSTGRES_USER:-ardor}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ARDOR_ENCRYPTION_KEY: ${ARDOR_ENCRYPTION_KEY:?ARDOR_ENCRYPTION_KEY must be set}
      ARDOR_ADMIN_EMAILS: ${ARDOR_ADMIN_EMAILS:-}
      # Off by default: user-supplied Base URLs must resolve to public addresses, so a
      # tenant cannot point the server at the internal network. Turn on only for local
      # development against a self-hosted model (Ollama, LM Studio, a local embedding server).
      ARDOR_ALLOW_PRIVATE_API_BASE_URLS: ${ARDOR_ALLOW_PRIVATE_API_BASE_URLS:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ARDOR_RESUME_STORAGE: /app/data/resumes
      ARDOR_HTTP_PROXY_HOST: ${ARDOR_HTTP_PROXY_HOST:-}
      ARDOR_HTTP_PROXY_PORT: ${ARDOR_HTTP_PROXY_PORT:-0}
    # Docker's embedded resolver forwards to whatever the host has configured, which on
    # some Windows/VPN setups answers nothing. Every outbound LLM call then fails at DNS
    # with "Base URL 的主机暂时无法解析" before a single byte is sent. Pinning public
    # upstreams fixes external names; container-to-container names still resolve through
    # 127.0.0.11 as before. Override per environment if these resolvers are unreachable.
    dns:
      - ${ARDOR_DNS_PRIMARY:-223.5.5.5}
      - ${ARDOR_DNS_SECONDARY:-119.29.29.29}
    # Docker Desktop normally publishes host.docker.internal through the embedded
    # resolver, which the pinned upstreams above bypass. Mapping it explicitly keeps
    # ARDOR_HTTP_PROXY_HOST and any locally hosted model endpoint reachable.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ardor-resume-data:/app/data/resumes
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      network: host
      args:
        ARDOR_BACKEND_URL: http://backend:8080
    environment:
      ARDOR_BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ardor-postgres-data:
  ardor-redis-data:
  ardor-resume-data:
