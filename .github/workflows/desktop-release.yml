name: Windows desktop installer

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify product version
        shell: pwsh
        run: |
          node scripts/check-version.mjs
          $expected = "v$((Get-Content -Raw -Encoding UTF8 desktop/package.json | ConvertFrom-Json).version)"
          if ($env:RELEASE_TAG -ne $expected) { throw "Release tag $env:RELEASE_TAG does not match $expected" }
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Determine signing mode
        id: signing
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_SIGNER_THUMBPRINT: ${{ vars.WIN_SIGNER_THUMBPRINT }}
        run: |
          $configured = @($env:WIN_CSC_LINK, $env:WIN_CSC_KEY_PASSWORD, $env:WIN_SIGNER_THUMBPRINT) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($configured.Count -eq 0) {
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Warning 'No signing certificate configured. Publishing an unsigned installer; Windows may warn about an unknown publisher.'
          } elseif ($configured.Count -ne 3 -or $env:WIN_SIGNER_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'Partial signing configuration. Configure all of WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD, WIN_SIGNER_THUMBPRINT, or none of them.'
          } else {
            "signed=true" >> $env:GITHUB_OUTPUT
          }
      - name: Build bilingual Windows installer
        working-directory: desktop
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:SIGNED_BUILD -eq 'true') { npm run dist:win:signed } else { npm run dist:win }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify release artifact and signatures if configured
        shell: pwsh
        env:
          WIN_SIGNER_THUMBPRINT: ${{ vars.WIN_SIGNER_THUMBPRINT }}
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
        run: |
          if ($env:SIGNED_BUILD -eq 'true') {
            ./desktop/scripts/verify-signed-release.ps1 -DistDirectory desktop/dist -ExpectedThumbprint $env:WIN_SIGNER_THUMBPRINT
          } else {
            ./desktop/scripts/verify-signed-release.ps1 -DistDirectory desktop/dist
          }
      - name: Attach installer and update metadata to this release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @(Get-ChildItem -LiteralPath desktop/dist -File | Where-Object { $_.Name -match '^Project-Ardor-Setup-.+-x64\.exe(\.blockmap)?$' -or $_.Name -eq 'latest.yml' })
          if ($assets.Count -ne 3) { throw "Expected installer, blockmap and latest.yml; found $($assets.Count) assets." }
          foreach ($asset in $assets) {
            $existing = @($release.assets | Where-Object { $_.name -eq $asset.Name })
            if ($existing.Count -gt 1 -or ($existing.Count -eq 1 -and $existing[0].size -le 0)) {
              throw "Release asset is incomplete or duplicated: $($asset.Name)"
            }
            if ($existing.Count -eq 1) {
              Write-Host "Already attached: $($asset.Name)"
            } else {
              gh release upload $env:RELEASE_TAG $asset.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Publish installer to public download repository
        shell: pwsh
        env:
          SOURCE_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.ARDOR_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
        run: |
          $repo = 'isCharles/project-ardor-releases'
          $env:GH_TOKEN = $env:SOURCE_TOKEN
          $visibility = gh repo view $repo --json visibility --jq '.visibility'
          if ($LASTEXITCODE -ne 0 -or $visibility -ne 'PUBLIC') { throw 'Desktop download repository must be public.' }
          $publishedJson = gh release view $env:RELEASE_TAG --repo $repo --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $published = $publishedJson | ConvertFrom-Json
            $expected = @('latest.yml', "Project-Ardor-Setup-$($env:RELEASE_TAG.TrimStart('v'))-x64.exe", "Project-Ardor-Setup-$($env:RELEASE_TAG.TrimStart('v'))-x64.exe.blockmap")
            $complete = -not $published.isDraft -and @($published.assets).Count -eq 3
            foreach ($name in $expected) {
              $match = @($published.assets | Where-Object { $_.name -eq $name -and $_.size -gt 0 })
              if ($match.Count -ne 1) { $complete = $false }
            }
            if ($complete) { Write-Host "Public installer release $env:RELEASE_TAG is already complete."; exit 0 }
          }
          if ([string]::IsNullOrWhiteSpace($env:PUBLIC_TOKEN)) {
            throw 'ARDOR_RELEASES_TOKEN is required to publish a new or incomplete desktop update release.'
          }
          $env:GH_TOKEN = $env:PUBLIC_TOKEN
          $signatureNotice = if ($env:SIGNED_BUILD -eq 'true') { 'The installer was signed and verified before upload.' } else { 'The installer is unsigned. Windows may show a SmartScreen warning; verify this official download before choosing whether to keep it.' }
          $notes = "Project Ardor $env:RELEASE_TAG Windows x64 installer. This desktop client needs an Ardor server. $signatureNotice"
          $assets = @(Get-ChildItem -LiteralPath desktop/dist -File | Where-Object { $_.Name -match '^Project-Ardor-Setup-.+-x64\.exe(\.blockmap)?$' -or $_.Name -eq 'latest.yml' })
          if ($assets.Count -ne 3) { throw "Expected installer, blockmap and latest.yml; found $($assets.Count) assets." }
          $existingJson = gh release view $env:RELEASE_TAG --repo $repo --json assets,isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
          } else {
            gh release create $env:RELEASE_TAG --repo $repo --target main --title "Project Ardor $env:RELEASE_TAG" --notes $notes --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $existing = [pscustomobject]@{ assets = @(); isDraft = $true }
          }
          foreach ($asset in $assets) {
            if (@($existing.assets | Where-Object { $_.name -eq $asset.Name -and $_.size -gt 0 }).Count -eq 1) { continue }
            gh release upload $env:RELEASE_TAG $asset.FullName --repo $repo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release edit $env:RELEASE_TAG --repo $repo --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
