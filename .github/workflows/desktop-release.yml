name: Windows desktop installer

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify product version
        shell: pwsh
        run: |
          node scripts/check-version.mjs
          $expected = "v$((Get-Content -Raw -Encoding UTF8 desktop/package.json | ConvertFrom-Json).version)"
          if ($env:RELEASE_TAG -ne $expected) { throw "Release tag $env:RELEASE_TAG does not match $expected" }
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Determine signing mode
        id: signing
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_SIGNER_THUMBPRINT: ${{ vars.WIN_SIGNER_THUMBPRINT }}
        run: |
          $configured = @($env:WIN_CSC_LINK, $env:WIN_CSC_KEY_PASSWORD, $env:WIN_SIGNER_THUMBPRINT) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($configured.Count -eq 0) {
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Warning 'No signing certificate configured. Publishing an unsigned installer; Windows may warn about an unknown publisher.'
          } elseif ($configured.Count -ne 3 -or $env:WIN_SIGNER_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'Partial signing configuration. Configure all of WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD, WIN_SIGNER_THUMBPRINT, or none of them.'
          } else {
            "signed=true" >> $env:GITHUB_OUTPUT
          }
      - name: Build bilingual Windows installer
        working-directory: desktop
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:SIGNED_BUILD -eq 'true') { npm run dist:win:signed } else { npm run dist:win }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify release artifact and signatures if configured
        shell: pwsh
        env:
          WIN_SIGNER_THUMBPRINT: ${{ vars.WIN_SIGNER_THUMBPRINT }}
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
        run: |
          if ($env:SIGNED_BUILD -eq 'true') {
            ./desktop/scripts/verify-signed-release.ps1 -DistDirectory desktop/dist -ExpectedThumbprint $env:WIN_SIGNER_THUMBPRINT
          } else {
            ./desktop/scripts/verify-signed-release.ps1 -DistDirectory desktop/dist
          }
      - name: Attach installer and update metadata to this release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" desktop/dist/*.exe desktop/dist/*.exe.blockmap desktop/dist/latest.yml
      - name: Publish installer to public download repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ARDOR_RELEASES_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SIGNED_BUILD: ${{ steps.signing.outputs.signed }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'ARDOR_RELEASES_TOKEN is required to publish desktop updates to the public download repository.'
          }
          $repo = 'isCharles/project-ardor-releases'
          $visibility = gh repo view $repo --json visibility --jq '.visibility'
          if ($LASTEXITCODE -ne 0 -or $visibility -ne 'PUBLIC') { throw 'Desktop download repository must be public.' }
          $signatureNotice = if ($env:SIGNED_BUILD -eq 'true') { 'The installer was signed and verified before upload.' } else { 'The installer is unsigned. Windows may show a SmartScreen warning; verify this official download before choosing whether to keep it.' }
          $notes = "Project Ardor $env:RELEASE_TAG Windows x64 installer. This desktop client needs an Ardor server. $signatureNotice"
          $assets = @(Get-ChildItem -LiteralPath desktop/dist -File | Where-Object { $_.Name -match '^Project-Ardor-Setup-.+-x64\.exe(\.blockmap)?$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 3) { throw "Expected installer, blockmap and latest.yml; found $($assets.Count) assets." }
          gh release create $env:RELEASE_TAG --repo $repo --target main --title "Project Ardor $env:RELEASE_TAG" --notes $notes --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $env:RELEASE_TAG @assets --repo $repo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --repo $repo --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
