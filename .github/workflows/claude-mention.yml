name: Claude Mention

# 按需触发：在 PR 评论里写 @claude 才会跑。
# 自动审查刻意不监听 synchronize，所以 codex 改完之后用这个来要一次重审，
# 额度花在你真正需要的时候。
#
# 这里只监听 PR 上的评论（issue_comment 在 GitHub 上同时覆盖 PR 评论），
# 并用 if: 做了前置过滤，避免每条无关评论都白启动一个 runner。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  respond:
    # issue_comment 也会在普通 issue 上触发，这里限定必须是 PR 且提到了 @claude。
    if: |
      (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 不传 prompt：让 Claude 直接读那条评论，按你写的内容做事
      # （例如「@claude 只看这次改的 migration 能不能在存量库上升级」）。
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cd backend && ./mvnw -o test),Bash(cd frontend && npm run lint),Bash(cd frontend && npm run typecheck)"
