name: Database migrations

on:
  pull_request:
    paths:
      - "backend/src/main/resources/db/migration/**"
      - ".github/tests/conversation-title-*.sql"
      - ".github/tests/background-tasks-*.sql"
      - ".github/tests/background-read-*.sql"
      - ".github/tests/recap-metadata-*.sql"
      - ".github/tests/final-minutes-*.sql"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated PostgreSQL 17 with pgvector
        run: |
          docker run --detach --name ardor-migration-check \
            --env POSTGRES_PASSWORD=migration-check-only \
            --env POSTGRES_DB=ardor \
            pgvector/pgvector:pg17
          for attempt in {1..30}; do
            if docker exec ardor-migration-check pg_isready -U postgres -d ardor; then
              exit 0
            fi
            sleep 2
          done
          docker logs ardor-migration-check
          exit 1

      - name: Apply every migration to a clean database
        shell: bash
        run: |
          mapfile -t migrations < <(find backend/src/main/resources/db/migration -maxdepth 1 -name 'V*.sql' | sort -V)
          test "${#migrations[@]}" -gt 0
          for migration in "${migrations[@]}"; do
            echo "Applying $(basename "$migration")"
            if [[ "$(basename "$migration")" == "V43__strip_recap_metadata.sql" ]]; then
              docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 < .github/tests/recap-metadata-before.sql
              for pass in 1 2; do
                docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 < backend/src/main/resources/db/migration/beforeEachMigrate__preserve_legacy_recap_metadata.sql
              done
            fi
            if [[ "$(basename "$migration")" == "V34__add_background_task_notifications.sql" ]]; then
              docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 \
                < .github/tests/background-tasks-before.sql
            fi
            if [[ "$(basename "$migration")" == "V32__add_conversation_title_origin.sql" ]]; then
              docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 \
                < .github/tests/conversation-title-before.sql
            fi
            if [[ "$(basename "$migration")" == "V54__detach_interview_sessions_on_resume_analysis_delete.sql" ]]; then
              docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 < .github/tests/resume-detach-before.sql
            fi
            if [[ "$(basename "$migration")" == "V59__final_interview_minutes.sql" ]]; then
              docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 < .github/tests/final-minutes-before.sql
            fi
            docker exec -i ardor-migration-check \
              psql -U postgres -d ardor -v ON_ERROR_STOP=1 < "$migration"
            if [[ "$(basename "$migration")" == "V59__final_interview_minutes.sql" ]]; then
              docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 < .github/tests/final-minutes-after.sql
            fi
            if [[ "$(basename "$migration")" == "V54__detach_interview_sessions_on_resume_analysis_delete.sql" ]]; then
              docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 < .github/tests/resume-detach-after.sql
            fi
            if [[ "$(basename "$migration")" == "V43__strip_recap_metadata.sql" ]]; then
              docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 < .github/tests/recap-metadata-after.sql
            fi
            if [[ "$(basename "$migration")" == "V32__add_conversation_title_origin.sql" ]]; then
              docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 \
                < .github/tests/conversation-title-after.sql
            fi
            if [[ "$(basename "$migration")" == "V34__add_background_task_notifications.sql" ]]; then
              docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 \
                < .github/tests/background-tasks-after.sql
            fi
            if [[ "$(basename "$migration")" == "V35__preserve_background_result_read_versions.sql" ]]; then
              docker exec -i ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 \
                < .github/tests/background-read-versions-after.sql
            fi
          done
          docker exec ardor-migration-check psql -U postgres -d ardor -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) FROM agent_runs;"
