name: Golden Path acceptance

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/agent-eval*.mjs"
      - "scripts/agent-eval-cases.json"
      - ".github/workflows/golden-path-acceptance.yml"
      - ".github/tests/recap-metadata-*.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/ardor
      DATABASE_USER: ardor
      DATABASE_PASSWORD: acceptance-only
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      ARDOR_ALLOW_PRIVATE_API_BASE_URLS: "true"
      ARDOR_ACCEPTANCE_DISPOSABLE_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Agent evaluation assertions
        run: node --test scripts/agent-eval-assertions.test.mjs scripts/agent-eval-sse.test.mjs

      - name: Start disposable database and Redis
        shell: bash
        run: |
          docker run -d --name ardor-acceptance-postgres -p 5432:5432 \
            -e POSTGRES_USER=ardor -e POSTGRES_PASSWORD=acceptance-only \
            -e POSTGRES_DB=ardor pgvector/pgvector:pg17
          docker run -d --name ardor-acceptance-redis -p 6379:6379 redis:7-alpine
          for attempt in {1..40}; do
            if docker exec ardor-acceptance-postgres pg_isready -U ardor -d ardor \
                && docker exec ardor-acceptance-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          docker logs ardor-acceptance-postgres
          exit 1

      - name: Build backend and start isolated services
        shell: bash
        run: |
          cd backend
          mvn -B -q test
          mvn -B -q -DskipTests package
          echo "ARDOR_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "ARDOR_ACCEPTANCE_UI_SUFFIX=$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')" >> "$GITHUB_ENV"
          node src/test/resources/fake-llm-server.mjs > "$RUNNER_TEMP/fake-llm.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fake-llm.pid"

      - name: Verify fresh migration and populated V35 upgrade fixture
        shell: bash
        run: |
          set -euo pipefail
          probe_pid=""
          trap 'if [[ -n "$probe_pid" ]]; then kill "$probe_pid" 2>/dev/null || true; fi' EXIT
          wait_probe() {
            for attempt in {1..90}; do
              if curl --silent --fail http://127.0.0.1:8081/actuator/health | grep -q '"status":"UP"'; then return; fi
              sleep 2
            done
            echo "Migration probe did not become healthy"
            exit 1
          }
          stop_probe() {
            test "$probe_pid" -gt 1
            kill "$probe_pid"
            for attempt in {1..45}; do
              if ! kill -0 "$probe_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$probe_pid" 2>/dev/null; then echo "Probe did not stop"; exit 1; fi
            wait "$probe_pid" || true
            probe_pid=""
          }
          java -jar backend/target/ardor-backend-0.7.0.jar --server.port=8081 --spring.flyway.target=35 --spring.jpa.hibernate.ddl-auto=none --app.agent.queue.enabled=false --spring.datasource.hikari.maximum-pool-size=2 > "$RUNNER_TEMP/migration-upgrade.log" 2>&1 &
          probe_pid=$!
          wait_probe
          docker exec -i ardor-acceptance-postgres psql -U ardor -d ardor -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users(id,email,password_hash) VALUES ('10000000-0000-4000-8000-000000000001','migration-sentinel@ardor.invalid','not-a-login-hash');
          INSERT INTO conversations(id,user_id,title) VALUES ('10000000-0000-4000-8000-000000000002','10000000-0000-4000-8000-000000000001','Upgrade sentinel');
          INSERT INTO messages(id,user_id,conversation_id,role,content) VALUES ('10000000-0000-4000-8000-000000000003','10000000-0000-4000-8000-000000000001','10000000-0000-4000-8000-000000000002','USER','Upgrade sentinel preserved');
          SQL
          docker exec -i ardor-acceptance-postgres psql -U ardor -d ardor -v ON_ERROR_STOP=1 < .github/tests/recap-metadata-before.sql
          stop_probe
          docker exec ardor-acceptance-postgres psql -U ardor -d ardor -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ardor_fresh_probe'
          java -jar backend/target/ardor-backend-0.7.0.jar --server.port=8081 --spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ardor_fresh_probe --spring.datasource.hikari.maximum-pool-size=2 > "$RUNNER_TEMP/migration-fresh.log" 2>&1 &
          probe_pid=$!
          wait_probe
          test "$(docker exec ardor-acceptance-postgres psql -U ardor -d ardor_fresh_probe -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='39' AND success")" = "1"
          test "$(docker exec ardor-acceptance-postgres psql -U ardor -d ardor_fresh_probe -Atc "SELECT COUNT(*) FROM agent_message_queue")" = "0"
          stop_probe

      # Keep migration probes before the API run: its final request deliberately
      # waits in the model provider and must be interrupted immediately afterward.
      - name: Verify populated V49 interview record upgrade
        run: bash backend/src/test/resources/interview-round-upgrade.sh
      - name: Verify populated V50 learning origin upgrade
        run: bash backend/src/test/resources/interview-round-upgrade.sh learning
      - name: Verify populated V51 learning attempt upgrade
        run: bash backend/src/test/resources/interview-round-upgrade.sh attempts

      - name: Run end-to-end Golden Path
        shell: bash
        run: |
          java -jar backend/target/ardor-backend-0.7.0.jar --spring.datasource.hikari.maximum-pool-size=2 --app.agent.stream.silence-timeout=5s --app.ai-jobs.stale-after=10s --app.ai-jobs.maintenance-delay=1s > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for attempt in {1..90}; do
            if curl --silent --fail http://127.0.0.1:8080/actuator/health \
                | grep -q '"status":"UP"'; then
              test "$(docker exec ardor-acceptance-postgres psql -U ardor -d ardor -Atc "SELECT COUNT(*) FROM flyway_schema_history WHERE version='39' AND success")" = "1"
              test "$(docker exec ardor-acceptance-postgres psql -U ardor -d ardor -Atc "SELECT COUNT(*) FROM messages WHERE id='10000000-0000-4000-8000-000000000003' AND content='Upgrade sentinel preserved'")" = "1"
              docker exec -i ardor-acceptance-postgres psql -U ardor -d ardor -v ON_ERROR_STOP=1 < .github/tests/recap-metadata-after.sql
              # New users are now Free, not gifted paid members. These synthetic workflow
              # fixtures exercise repeated business paths; quota denial has separate tests.
              test "$ARDOR_ACCEPTANCE_DISPOSABLE_DB" = true
              # Explicit deny fixture before enabling larger synthetic workflow quotas.
              docker exec ardor-acceptance-postgres psql -U ardor -d ardor -v ON_ERROR_STOP=1 -c "UPDATE usage_policies SET free_monthly_limit=0 WHERE feature='AGENT_CHAT'"
              ARDOR_ACCEPTANCE_EXPECT_QUOTA=true node backend/src/test/resources/stream-error-acceptance.mjs
              docker exec ardor-acceptance-postgres psql -U ardor -d ardor -v ON_ERROR_STOP=1 -c "UPDATE usage_policies SET free_monthly_limit=GREATEST(free_monthly_limit,plus_monthly_limit), free_weekly_limit=GREATEST(free_weekly_limit,plus_weekly_limit)"
              node backend/src/test/resources/interview-minutes-acceptance.mjs
              node backend/src/test/resources/golden-path-acceptance.mjs
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"
          exit 1

      - name: Verify approval mode ownership and legacy grant compatibility
        run: node backend/src/test/resources/approval-mode-acceptance.mjs
      - name: Verify unified streaming entry and private trace ownership
        env:
          ARDOR_ACCEPTANCE_API_BASE: http://127.0.0.1:8080
          ARDOR_ACCEPTANCE_LLM_BASE: http://127.0.0.1:8090
        run: |
          test "$ARDOR_ACCEPTANCE_DISPOSABLE_DB" = true
          # Bounded synthetic history reaches real compaction; rate denial has separate coverage.
          docker exec ardor-acceptance-postgres psql -U ardor -d ardor -v ON_ERROR_STOP=1 -c "UPDATE usage_policies SET user_minute_limit=GREATEST(user_minute_limit,30), global_minute_limit=GREATEST(global_minute_limit,1000) WHERE feature='AGENT_CHAT'"
          node backend/src/test/resources/agent-runtime-acceptance.mjs

      - name: Verify a fact survives a hundred turns of repeated compaction
        env:
          ARDOR_ACCEPTANCE_API_BASE: http://127.0.0.1:8080
          ARDOR_ACCEPTANCE_LLM_BASE: http://127.0.0.1:8090
        run: |
          test "$ARDOR_ACCEPTANCE_DISPOSABLE_DB" = true
          # A hundred accepted turns exceed the per-minute and weekly guards; this is
          # synthetic headroom for the run only, not a change to product defaults.
          docker exec ardor-acceptance-postgres psql -U ardor -d ardor -v ON_ERROR_STOP=1 -c "UPDATE usage_policies SET free_monthly_limit=GREATEST(free_monthly_limit,1000), free_weekly_limit=GREATEST(free_weekly_limit,1000), user_minute_limit=GREATEST(user_minute_limit,400), global_minute_limit=GREATEST(global_minute_limit,4000) WHERE feature='AGENT_CHAT'"
          node backend/src/test/resources/semantic-recall-acceptance.mjs

      - name: Verify automation and calendar advice module contracts and confirmation boundary
        env:
          ARDOR_ACCEPTANCE_API_BASE: http://127.0.0.1:8080
          ARDOR_ACCEPTANCE_LLM_BASE: http://127.0.0.1:8090
        run: node backend/src/test/resources/automation-module-acceptance.mjs

      - name: Verify resume application ownership and module confirmation contracts
        env:
          ARDOR_ACCEPTANCE_API_BASE: http://127.0.0.1:8080
          ARDOR_ACCEPTANCE_LLM_BASE: http://127.0.0.1:8090
        run: node backend/src/test/resources/resume-module-acceptance.mjs

      - name: Verify owned profile and all scheduling tool contracts
        env:
          ARDOR_ACCEPTANCE_API_BASE: http://127.0.0.1:8080
          ARDOR_ACCEPTANCE_LLM_BASE: http://127.0.0.1:8090
        shell: bash
        run: |
          # This dense synthetic flow makes nine agent turns; rate-limit rejection
          # has separate tests. Never apply this fixture policy to a daily database.
          test "$ARDOR_ACCEPTANCE_DISPOSABLE_DB" = true
          docker exec ardor-acceptance-postgres psql -U ardor -d ardor -v ON_ERROR_STOP=1 -c "UPDATE usage_policies SET user_minute_limit=GREATEST(user_minute_limit,30) WHERE feature='AGENT_CHAT'"
          node backend/src/test/resources/profile-calendar-acceptance.mjs

      - name: Verify learning tool module and host proposal contracts
        env:
          ARDOR_ACCEPTANCE_API_BASE: http://127.0.0.1:8080
          ARDOR_ACCEPTANCE_LLM_BASE: http://127.0.0.1:8090
        shell: bash
        run: |
          # Earlier module probes share the global minute window. Quota refusal
          # is verified before these dense workflows; never alter daily policies.
          test "$ARDOR_ACCEPTANCE_DISPOSABLE_DB" = true
          docker exec ardor-acceptance-postgres psql -U ardor -d ardor -v ON_ERROR_STOP=1 -c "UPDATE usage_policies SET global_minute_limit=GREATEST(global_minute_limit,1000) WHERE feature='AGENT_CHAT'"
          node backend/src/test/resources/learning-module-acceptance.mjs

      - name: Restart backend to verify persisted task and read state
        shell: bash
        run: |
          task_backend_pid=$(cat "$RUNNER_TEMP/backend.pid")
          test "$task_backend_pid" -gt 1
          kill "$task_backend_pid"
          for attempt in {1..45}; do
            if ! kill -0 "$task_backend_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$task_backend_pid" 2>/dev/null; then
            echo "Backend did not exit safely"
            exit 1
          fi
          java -jar backend/target/ardor-backend-0.7.0.jar --spring.datasource.hikari.maximum-pool-size=2 --app.agent.stream.silence-timeout=5s --app.ai-jobs.stale-after=10s --app.ai-jobs.maintenance-delay=1s >> "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for attempt in {1..90}; do
            if curl --silent --fail http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Start frontend for acceptance checks
        shell: bash
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps --only-shell chromium
          npm run build
          npm run start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for attempt in {1..45}; do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become healthy"
          exit 1

      - name: Verify pre-stream validation through frontend proxy
        env:
          ARDOR_ACCEPTANCE_API_BASE: http://127.0.0.1:3000
        run: node backend/src/test/resources/stream-error-acceptance.mjs

      - name: Verify pre-migration login session through frontend proxy
        working-directory: backend
        env:
          ARDOR_SESSION_COMPAT_RUNTIME: "true"
          ARDOR_SESSION_COMPAT_REDIS_CONTAINER: ardor-acceptance-redis
        run: mvn -B -q -Dtest=LegacySessionRuntimeTests test

      - name: Verify explicit learning origins and independent preparation targets
        shell: bash
        run: |
          test "$ARDOR_ACCEPTANCE_DISPOSABLE_DB" = true
          docker exec ardor-acceptance-postgres psql -U ardor -d ardor -v ON_ERROR_STOP=1 -c "UPDATE usage_policies SET free_monthly_limit=100, member_monthly_limit=100, user_minute_limit=100, global_minute_limit=1000 WHERE feature IN ('LEARNING_PLAN','INTERVIEW_RECAP')"
          node backend/src/test/resources/learning-context-acceptance.mjs

      - name: Verify connected learning progress in the redesigned browser UI
        working-directory: frontend
        env:
          ARDOR_ACCEPTANCE_API_BASE: http://127.0.0.1:8080
          ARDOR_ACCEPTANCE_LLM_BASE: http://127.0.0.1:8090
        run: node tests/learning-progress-live.mjs

      - name: Verify final minutes normalize directly in the browser
        working-directory: frontend
        env:
          ARDOR_ACCEPTANCE_API_BASE: http://127.0.0.1:8080
          ARDOR_ACCEPTANCE_LLM_BASE: http://127.0.0.1:8090
        run: node tests/final-minutes-live.mjs

      - name: Upload browser screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-path-browser-failure
          path: |
            ${{ runner.temp }}/ardor-ui-failure.png
            frontend/.next/learning-progress-live-failure.png
            frontend/.next/final-minutes-live-failure.png
          if-no-files-found: ignore

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          tail -n 150 "$RUNNER_TEMP/backend.log" 2>/dev/null || true
          tail -n 80 "$RUNNER_TEMP/fake-llm.log" 2>/dev/null || true
          tail -n 80 "$RUNNER_TEMP/frontend.log" 2>/dev/null || true
          tail -n 60 "$RUNNER_TEMP/migration-upgrade.log" 2>/dev/null || true
          tail -n 60 "$RUNNER_TEMP/migration-fresh.log" 2>/dev/null || true
