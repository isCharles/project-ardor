name: Frontend quality

on:
  pull_request:
    paths:
      - "frontend/**"
      - "desktop/**"
      - "scripts/report-export-smoke.mjs"
      - "scripts/latex-report-contract.mjs"
      - ".github/workflows/frontend-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build real PDF-capable frontend
        run: docker build --target runtime -t ardor-pdf-acceptance frontend
      - name: Start isolated synthetic report environment
        run: |
          docker network create ardor-pdf-acceptance
          docker run --rm -d --name ardor-pdf-fixture --network ardor-pdf-acceptance --network-alias report-backend --mount "type=bind,source=$PWD/scripts/report-export-smoke.mjs,target=/probe.mjs,readonly" node:24-alpine node /probe.mjs fixture
          docker run --rm -d --name ardor-pdf-frontend --network ardor-pdf-acceptance -p 127.0.0.1:3315:3000 -e ARDOR_BACKEND_URL=http://report-backend:8080 --memory=1536m --cpus=2 ardor-pdf-acceptance
          for attempt in {1..45}; do
            if curl --silent --fail http://127.0.0.1:3315/login >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Export and inspect actual Chinese PDF
        run: |
          node scripts/latex-report-contract.mjs
          node scripts/report-export-smoke.mjs http://127.0.0.1:3315 backend/target/report-export
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdfinfo backend/target/report-export/synthetic-report.pdf
          pdftotext -layout backend/target/report-export/synthetic-report.pdf backend/target/report-export/report.txt
          grep -q '简历诊断报告' backend/target/report-export/report.txt
          tr -d '[:space:]' < backend/target/report-export/report.txt > backend/target/report-export/normalized.txt
          grep -q '合成问题9' backend/target/report-export/normalized.txt
          pdftotext -layout backend/target/report-export/synthetic-latex-workspace.pdf backend/target/report-export/workspace.txt
          grep -q '合成 LaTeX 工作区' backend/target/report-export/workspace.txt
          test "$(docker exec ardor-pdf-frontend id -u)" = 1000
          test -z "$(docker exec ardor-pdf-frontend find /tmp -maxdepth 1 -name '.latex-report-*' -print)"
          pdftoppm -scale-to 1000 -png backend/target/report-export/synthetic-report.pdf backend/target/report-export/page
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-report-export
          path: backend/target/report-export
          if-no-files-found: ignore
      - name: Stop only isolated PDF fixtures
        if: always()
        run: |
          docker logs ardor-pdf-frontend --tail 30 || true
          docker rm -f ardor-pdf-frontend ardor-pdf-fixture || true
          docker network rm ardor-pdf-acceptance || true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Next.js types
        run: npx next typegen
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Navigation catalog compatibility contract
        run: node tests/navigation-catalog.mjs
      - name: Markdown numeric ranges and formatting
        run: node --experimental-strip-types tests/markdown-ranges.mjs
      - name: Streaming error and proxy compatibility contract
        run: node tests/stream-error-contract.mjs
      - name: Learning feedback identity and legacy preservation contract
        run: node tests/learning-feedback-contract.mjs
      - name: Build production frontend
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps --only-shell chromium
      - name: Workspace UI regression (mock APIs)
        run: node tests/workspace-ui.mjs
      - name: Resume scoring UI regression (mock APIs)
        run: node tests/resume-scoring-ui.mjs
      - name: Agent trace UI regression (mock APIs)
        run: node tests/agent-trace-ui.mjs
      - name: Learning operation UI regression (mock APIs)
        run: node tests/learning-operation-ui.mjs
      - name: Agent approval modes UI regression (mock APIs)
        run: node tests/agent-approval-ui.mjs
      - name: Context usage and compaction UI regression (mock APIs)
        run: node tests/context-usage-ui.mjs
      - name: One resume against several job descriptions UI regression (mock APIs)
        run: node tests/resume-multi-jd-ui.mjs
      - name: Primary resume and displayed report UI regression (mock APIs)
        run: node tests/resume-primary-ui.mjs
      - name: Resume workspace chat and frozen-resume UI regression (mock APIs)
        run: node tests/latex-workspace-ui.mjs
      - name: Compact chat layout UI regression (mock APIs)
        run: node tests/compact-chat-ui.mjs
      - name: Learning feedback and status groups UI regression (mock APIs)
        run: node tests/learning-feedback-ui.mjs
      - name: Course reading position UI regression (mock APIs)
        run: node tests/course-reading-position-ui.mjs
      - name: Profile avatar UI regression (mock APIs)
        run: node tests/profile-avatar-ui.mjs
      - name: Subscription validity UI regression (mock APIs)
        run: node tests/usage-validity-ui.mjs
      - name: Usage quota window UI regression (mock APIs)
        run: node tests/usage-quota-window-ui.mjs
      - name: Token pack catalog and redemption UI regression (mock APIs)
        run: node tests/usage-token-packs-ui.mjs
      - name: Desktop update sidebar UI (synthetic bridge)
        run: node tests/desktop-update-ui.mjs
      - name: Learning source and target UI regression (mock APIs)
        run: node tests/learning-context-ui.mjs
      - name: Interview pipeline UI regression (mock APIs)
        run: node tests/pipeline-ui.mjs
      - name: Upload pipeline UI screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-ui-failure
          path: frontend/.next/pipeline-*.png
          if-no-files-found: ignore

  desktop-window:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - name: Install Electron runtime for native window tests
        run: node node_modules/electron/install.js
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Real sandboxed Electron window regression
        run: node tests/desktop-chrome.mjs
        working-directory: frontend
