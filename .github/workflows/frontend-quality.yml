name: Frontend quality

on:
  pull_request:
    paths:
      - "frontend/**"
      - "desktop/**"
      - ".github/workflows/frontend-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Next.js types
        run: npx next typegen
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build production frontend
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Workspace UI regression (mock APIs)
        run: node tests/workspace-ui.mjs
      - name: Resume scoring UI regression (mock APIs)
        run: node tests/resume-scoring-ui.mjs
      - name: Learning operation UI regression (mock APIs)
        run: node tests/learning-operation-ui.mjs
      - name: Pipeline recap navigation regression (mock APIs)
        run: node tests/pipeline-ui.mjs
      - name: Confirmed interview minutes regression (mock APIs)
        run: node tests/interview-minutes-ui.mjs

  desktop-window:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - name: Install Electron runtime for native window tests
        run: node node_modules/electron/install.js
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Real sandboxed Electron window regression
        run: node tests/desktop-chrome.mjs
        working-directory: frontend
